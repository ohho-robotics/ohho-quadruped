name: ros2-nav2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nav2-headless-launch-test:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base-jammy
    env:
      ROS_DOMAIN_ID: "1"
      ROS_LOCALHOST_ONLY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install workspace ROS dependencies
        shell: bash
        run: bash scripts/ci/install-humble-ws-deps-container.sh
      - name: Build packages (Humble)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build --packages-select go2_description ohho_go2_bridge ohho_go2_navigation
      # URDF parse and launch --show-args. Gazebo Harmonic headless spawn is a
      # local check (docs/evidence/ohh-65.md), not this Humble job.
      - name: Check go2_description URDF and launch args
        shell: bash
        run: bash scripts/ci/check-go2-description.sh
      - name: Smoke bridge and sim-only sensors
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          export ROS2CLI_DISABLE_DAEMON=1
          ros2 daemon stop 2>/dev/null || true
          ros2 run ohho_go2_bridge go2_bridge_node > /tmp/go2_bridge_smoke.log 2>&1 &
          bridge_pid=$!
          ros2 run ohho_go2_navigation go2_sim_sensor_node > /tmp/go2_sim_sensor_smoke.log 2>&1 &
          sim_pid=$!
          deadline=$((SECONDS + 20))
          ready=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$bridge_pid" 2>/dev/null || ! kill -0 "$sim_pid" 2>/dev/null; then
              echo "bridge or sim sensor exited before required topics appeared"
              echo "----- bridge log -----"
              cat /tmp/go2_bridge_smoke.log || true
              echo "----- sim sensor log -----"
              cat /tmp/go2_sim_sensor_smoke.log || true
              exit 1
            fi
            topics=$(timeout 5 ros2 topic list 2>/dev/null || true)
            if echo "$topics" | grep -qx "/odom" \
              && echo "$topics" | grep -qx "/scan" \
              && echo "$topics" | grep -qx "/joint_states"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "timed out waiting for /odom /scan /joint_states"
            echo "----- bridge log -----"
            cat /tmp/go2_bridge_smoke.log || true
            echo "----- sim sensor log -----"
            cat /tmp/go2_sim_sensor_smoke.log || true
            exit 1
          fi
          kill "$bridge_pid" "$sim_pid" || true
      - name: Headless launch-test (~60s)
        shell: bash
        run: |
          bash scripts/ci/run-nav2-headless-test.sh
