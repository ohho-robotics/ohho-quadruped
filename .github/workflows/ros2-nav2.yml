name: ros2-nav2

on:
  push:
  pull_request:

jobs:
  nav2-headless-launch-test:
    runs-on: ubuntu-22.04
    env:
      ROS_DOMAIN_ID: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ROS apt sources (GHA)
        shell: bash
        run: bash scripts/ci/prepare-ros-apt-for-gha.sh
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: Install workspace ROS dependencies (rosdep)
        shell: bash
        run: bash scripts/ci/install-humble-ws-deps.sh
      - name: Build packages (Humble)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build --packages-select go2_description ohho_go2_bridge ohho_go2_navigation
      - name: Headless launch-test (~60s)
        shell: bash
        run: |
          bash scripts/ci/run-nav2-headless-test.sh
