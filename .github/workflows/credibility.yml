name: credibility

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone URL check (exercises README clone command)
        run: git clone https://github.com/ohho-robotics/ohho-quadruped.git /tmp/ohho-quadruped-clone
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (exercises README ruff check command)
        run: ruff check .
      - name: Install ohho-os (exercises README sim quickstart)
        run: pip install ohho-os
      - name: Doctor check (exercises README sim quickstart)
        run: ohho doctor
      - name: Sim quickstart (exercises README sim quickstart)
        run: ohho sim --robot unitree-go2 --seconds 2
      - name: Credibility check v2
        run: bash scripts/check-credibility.sh
