# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB
tone_instructions: "Be concise, direct and constructive. Flag real bugs, security gaps and edge cases first; skip nitpicks that tooling already catches."
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: true
  path_instructions:
    - path: "{ohho_go2,sim}/**/*.py"
      instructions: |
        Go2 control/DDS/sim code. Check command limits, timeouts and safe-stop behaviour, DDS guard
        logic preventing accidental real-robot commands, thread safety, and policy output clamping.
    - path: "ros2_ws/src/**"
      instructions: |
        ROS 2 bridge. Check QoS, parameter validation, callback thread safety and e-stop paths.
    - path: "tests/**"
      instructions: |
        Check tests are deterministic and never require real hardware.
    - path: "scripts/**"
      instructions: |
        Shell/Python scripts: check quoting, set -euo pipefail, and pinned dependency versions.
    - path: ".github/workflows/**"
      instructions: |
        Check actions are pinned (ideally to a commit SHA), permissions follow least privilege,
        secrets are never echoed or exposed to untrusted PR code, and caching/matrix logic is correct.
    - path: "**/*.md"
      instructions: |
        Check docs stay accurate against the code (commands, paths, flags). Flag unverifiable claims.
